server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: komoran-api-server

# KOMORAN 설정
komoran:
  # 모델 타입: FULL 또는 LIGHT
  model: ${KOMORAN_MODEL:FULL}

  # 사용자 사전 경로 (선택, 환경 변수로 지정 권장)
  # 예: export USER_DIC_PATH=/absolute/path/to/dic.user
  user-dic-path: ${USER_DIC_PATH:}

  # FWD 사전 경로 (선택, 환경 변수로 지정 권장)
  # 예: export FWD_DIC_PATH=/absolute/path/to/fwd.user
  fwd-dic-path: ${FWD_DIC_PATH:}

  # Partial FWD 사전 경로 (선택, 환경 변수로 지정 권장)
  # 예: export PARTIAL_FWD_DIC_PATH=/absolute/path/to/partial_fwd.user
  partial-fwd-dic-path: ${PARTIAL_FWD_DIC_PATH:}

  # 자동 리로드 활성화 (5분마다 파일 변경 체크)
  auto-reload: ${AUTO_RELOAD:true}

# 로깅 설정
logging:
  level:
    root: INFO
    kr.co.shineware.nlp.komoran: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# Actuator 설정 (헬스체크 등)
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
